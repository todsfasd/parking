<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>서울 시영주차장 실시간 주차 지도</title>

  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg:#f4f7fb;
      --panel:#ffffff;
      --text:#152033;
      --muted:#667085;
      --line:#e5e7eb;
      --primary:#2563eb;
      --green:#16a34a;
      --orange:#f59e0b;
      --red:#dc2626;
      --shadow:0 16px 40px rgba(15,23,42,.12);
    }
    *{box-sizing:border-box}
    body {
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    header {
      padding:22px 24px 14px;
      background:linear-gradient(135deg,#172554,#1d4ed8);
      color:white;
    }
    header h1 {
      margin:0 0 6px;
      font-size:clamp(22px,4vw,34px);
      letter-spacing:-.03em;
    }
    header p {
      margin:0;
      color:rgba(255,255,255,.82);
      font-size:14px;
    }
    .wrap {
      display:grid;
      grid-template-columns: 390px 1fr;
      gap:18px;
      padding:18px;
      height:calc(100vh - 96px);
      min-height:680px;
    }
    .sidebar {
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      min-height:0;
      overflow:hidden;
    }
    .stats {
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:10px;
      padding:16px;
      border-bottom:1px solid var(--line);
    }
    .stat {
      padding:13px;
      border-radius:16px;
      background:#f8fafc;
      border:1px solid #edf2f7;
    }
    .stat b {
      display:block;
      font-size:24px;
      line-height:1;
      margin-bottom:4px;
    }
    .stat span {
      font-size:12px;
      color:var(--muted);
    }
    .controls {
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      display:grid;
      gap:10px;
    }
    .input, select, button {
      width:100%;
      border:1px solid var(--line);
      border-radius:13px;
      padding:11px 12px;
      font-size:14px;
      background:#fff;
      color:var(--text);
      outline:none;
    }
    .input:focus, select:focus {
      border-color:#93c5fd;
      box-shadow:0 0 0 3px rgba(37,99,235,.12);
    }
    .row {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    button {
      background:var(--primary);
      color:white;
      border:none;
      cursor:pointer;
      font-weight:700;
      transition:.15s;
    }
    button:hover { filter:brightness(.96); transform:translateY(-1px); }
    .secondary {
      background:#eef2ff;
      color:#1d4ed8;
    }
    .gps-status {
      font-size:12px;
      line-height:1.45;
      color:var(--muted);
      background:#eff6ff;
      border:1px solid #bfdbfe;
      border-radius:13px;
      padding:10px 11px;
    }
    .gps-status.ok {
      color:#166534;
      background:#ecfdf5;
      border-color:#bbf7d0;
    }
    .gps-status.warn {
      color:#92400e;
      background:#fffbeb;
      border-color:#fde68a;
    }
    .gps-status.error {
      color:#991b1b;
      background:#fef2f2;
      border-color:#fecaca;
    }
    .list-head {
      padding:12px 16px;
      font-size:13px;
      color:var(--muted);
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      gap:10px;
    }
    .list {
      flex:1 1 auto;
      min-height:0;
      overflow:auto;
      padding:10px 10px 14px;
    }
    .card {
      padding:11px 12px;
      border:1px solid var(--line);
      border-radius:14px;
      margin-bottom:8px;
      background:#fff;
      cursor:pointer;
      transition:.15s;
    }
    .card:hover {
      border-color:#bfdbfe;
      box-shadow:0 8px 20px rgba(37,99,235,.10);
      transform:translateY(-1px);
    }
    .card.top-pick {
      border-color:#93c5fd;
      background:linear-gradient(180deg,#f8fbff,#fff);
    }
    .rank-badge {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:28px;
      height:28px;
      border-radius:999px;
      background:#1d4ed8;
      color:#fff;
      font-size:12px;
      font-weight:800;
      margin-right:8px;
      flex-shrink:0;
    }
    .score-line {
      margin-top:6px;
      font-size:12px;
      color:#1d4ed8;
      font-weight:700;
    }
    .card-title {
      display:flex;
      gap:8px;
      justify-content:space-between;
      align-items:flex-start;
      font-weight:800;
      letter-spacing:-.02em;
      line-height:1.3;
    }
    .badge {
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      padding:4px 8px;
      font-size:12px;
      white-space:nowrap;
      font-weight:800;
    }
    .badge.good { background:#dcfce7; color:#166534; }
    .badge.mid { background:#fef3c7; color:#92400e; }
    .badge.bad { background:#fee2e2; color:#991b1b; }
    .badge.none { background:#e5e7eb; color:#374151; }
    .meta {
      margin-top:6px;
      color:var(--muted);
      font-size:12px;
      line-height:1.4;
    }
    .spaces {
      margin-top:8px;
      height:6px;
      background:#e5e7eb;
      border-radius:99px;
      overflow:hidden;
    }
    .bar {
      height:100%;
      border-radius:99px;
      background:var(--green);
    }
    .map-panel {
      position:relative;
      min-height:0;
      border-radius:22px;
      overflow:hidden;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      background:#dbeafe;
    }
    #map {
      width:100%;
      height:100%;
      min-height:640px;
    }
    .map-note {
      position:absolute;
      left:16px;
      bottom:16px;
      z-index:500;
      background:rgba(255,255,255,.94);
      border:1px solid var(--line);
      border-radius:16px;
      padding:10px 12px;
      font-size:13px;
      color:var(--muted);
      box-shadow:0 10px 25px rgba(15,23,42,.12);
      max-width:min(480px, calc(100% - 32px));
    }
    .popup h3 {
      margin:0 0 6px;
      font-size:16px;
    }
    .popup p {
      margin:4px 0;
      font-size:13px;
    }
    .popup .big {
      font-size:15px;
      font-weight:800;
    }
    @media (max-width: 900px) {
      header { padding:18px 16px 12px; }
      .wrap {
        grid-template-columns:1fr;
        height:auto;
        min-height:0;
        padding:12px;
      }
      .sidebar { max-height:620px; }
      #map { min-height:520px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>서울 시영주차장 실시간 주차 지도</h1>
    <p>서울시 API에서 최신 주차대수를 가져오고, 60초마다 자동 갱신합니다.</p>
  </header>

  <main class="wrap">
    <section class="sidebar">
      <div class="stats">
        <div class="stat"><b id="coordCount">0</b><span>전체 주차장</span></div>
        <div class="stat"><b id="availableCount">0</b><span>잔여 주차면</span></div>
        <div class="stat"><b id="shownCount">0</b><span>현재 표시</span></div>
      </div>

      <div class="controls">
        <input id="searchInput" class="input" placeholder="주차장명, 주소 검색" />
        <div class="row">
          <select id="statusFilter">
            <option value="all">상태 전체</option>
            <option value="여유">여유</option>
            <option value="보통">보통</option>
            <option value="혼잡">혼잡</option>
            <option value="정보없음">정보없음</option>
          </select>
          <select id="sortSelect">
            <option value="availableDesc">잔여 많은 순</option>
            <option value="availableAsc">잔여 적은 순</option>
            <option value="nameAsc">이름순</option>
          </select>
        </div>
        <div class="row">
          <button id="fitAllBtn">전체 보기</button>
          <button id="nearHannamBtn" class="secondary">한강진역 주변</button>
        </div>
        <div class="row">
          <button id="locateBtn">GPS 확인</button>
          <button id="top3Btn" class="secondary">추천 Top 3</button>
        </div>
        <button id="refreshBtn" class="secondary">수동 새로고침</button>
        <div id="gpsStatus" class="gps-status">주차장 데이터를 불러오는 중입니다. 처음엔 5~10초 걸릴 수 있습니다.</div>
      </div>

      <div class="list-head">
        <span id="listTitle">주차장 목록</span>
        <span id="updatedAt"></span>
      </div>
      <div id="parkingList" class="list"></div>
    </section>

    <section class="map-panel">
      <div id="map"></div>
      <div class="map-note">
        추천 Top 3: Score = (1−거리_norm)×0.5 + 여유율×0.5 · 검색반경 5km · GPS 필요
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let PARKINGS = [];
    let filtered = [];
    let markers = [];
    let userMarker = null;
    let userCircle = null;
    let radiusCircle = null;
    let userPosition = null;
    let listMode = "all";

    const HANNAM = { lat: 37.5400, lng: 127.0017 };
    const SEARCH_RADIUS_KM = 5;

    const map = L.map("map", {
      center: [37.5665, 126.9780],
      zoom: 11,
      zoomControl: true,
    });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    const els = {
      coordCount: document.getElementById("coordCount"),
      availableCount: document.getElementById("availableCount"),
      shownCount: document.getElementById("shownCount"),
      searchInput: document.getElementById("searchInput"),
      statusFilter: document.getElementById("statusFilter"),
      sortSelect: document.getElementById("sortSelect"),
      parkingList: document.getElementById("parkingList"),
      updatedAt: document.getElementById("updatedAt"),
      gpsStatus: document.getElementById("gpsStatus"),
      listTitle: document.getElementById("listTitle"),
      fitAllBtn: document.getElementById("fitAllBtn"),
      nearHannamBtn: document.getElementById("nearHannamBtn"),
      locateBtn: document.getElementById("locateBtn"),
      top3Btn: document.getElementById("top3Btn"),
      refreshBtn: document.getElementById("refreshBtn"),
    };

    function badgeClass(status) {
      if (status === "여유") return "good";
      if (status === "보통") return "mid";
      if (status === "혼잡") return "bad";
      return "none";
    }

    function markerColor(status) {
      if (status === "여유") return "#16a34a";
      if (status === "보통") return "#f59e0b";
      if (status === "혼잡") return "#dc2626";
      return "#64748b";
    }

    function makeIcon(status) {
      const color = markerColor(status);
      return L.divIcon({
        className: "",
        html: `
          <div style="
            width:20px;height:20px;border-radius:50%;
            background:${color};border:3px solid #fff;
            box-shadow:0 3px 10px rgba(15,23,42,.35);
          "></div>
        `,
        iconSize: [20, 20],
        iconAnchor: [10, 10],
      });
    }

    function rate(p) {
      if (!p.total) return 0;
      return Math.max(0, Math.min(100, Math.round((p.available / p.total) * 100)));
    }

    function clearMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }

    function withCoords(items) {
      return items.filter(p => p.hasCoords && p.lat != null && p.lng != null);
    }

    function renderMarkers(items) {
      clearMarkers();

      withCoords(items).forEach(p => {
        const marker = L.marker([p.lat, p.lng], {
          icon: makeIcon(p.status)
        }).addTo(map);

        marker.bindPopup(`
          <div class="popup">
            <h3>${p.name}</h3>
            <p>${p.address || ""}</p>
            <p class="big">잔여 ${p.available}면 / 전체 ${p.total}면</p>
            <p>상태: ${p.status}</p>
            <p>요금: ${p.fee || "정보 없음"}</p>
            <p>전화: ${p.phone || "정보 없음"}</p>
            <p>업데이트: ${p.updated || "정보 없음"}</p>
          </div>
        `);

        marker._parkingCode = p.code;
        markers.push(marker);
      });
    }

    function availabilityRate(p) {
      if (!p.total || p.total <= 0) return 0;
      return Math.min(1, Math.max(0, p.available / p.total));
    }

    function calcParkingScore(p, userLat, userLng) {
      const distKm = distanceKm(userLat, userLng, p.lat, p.lng);
      if (distKm > SEARCH_RADIUS_KM) return null;

      const distanceNorm = Math.min(1, distKm / SEARCH_RADIUS_KM);
      const availRate = availabilityRate(p);
      const score = (1 - distanceNorm) * 0.5 + availRate * 0.5;

      return { distKm, distanceNorm, availRate, score };
    }

    function renderList(items, options = {}) {
      const { ranked = false } = options;
      els.parkingList.innerHTML = "";

      if (!items.length) {
        const emptyMsg = ranked
          ? `5km 이내 추천할 주차장이 없습니다. GPS 확인 후 다시 시도하세요.`
          : `조건에 맞는 주차장이 없습니다.`;
        els.parkingList.innerHTML = `<div class="card">${emptyMsg}</div>`;
        return;
      }

      items.forEach((p, index) => {
        const div = document.createElement("div");
        div.className = ranked ? "card top-pick" : "card";
        const rankHtml = ranked
          ? `<span class="rank-badge">${index + 1}</span>`
          : "";
        const scoreHtml = p.score != null
          ? `<div class="score-line">추천 ${(p.score * 100).toFixed(1)}점 · ${Math.round(p.distKm * 1000)}m · 여유율 ${(p.availRate * 100).toFixed(0)}%</div>`
          : "";

        div.innerHTML = `
          <div class="card-title">
            <span>${rankHtml}${p.name}</span>
            <span class="badge ${badgeClass(p.status)}">${p.status}</span>
          </div>
          <div class="meta">
            ${p.address || "주소 정보 없음"}<br>
            잔여 ${p.available}면 / 전체 ${p.total}면<br>
            ${p.fee || "요금 정보 없음"}<br>
            업데이트: ${p.updated || "정보 없음"}
            ${scoreHtml}
          </div>
          <div class="spaces">
            <div class="bar" style="width:${rate(p)}%; background:${markerColor(p.status)}"></div>
          </div>
        `;

        div.addEventListener("click", () => {
          if (!p.hasCoords || p.lat == null || p.lng == null) return;
          map.setView([p.lat, p.lng], 16);
          const marker = markers.find(m => m._parkingCode === p.code);
          if (marker) marker.openPopup();
        });

        els.parkingList.appendChild(div);
      });
    }

    function applyFilters() {
      listMode = "all";
      const q = els.searchInput.value.trim().toLowerCase();
      const status = els.statusFilter.value;
      const sort = els.sortSelect.value;

      filtered = PARKINGS.filter(p => {
        const text = `${p.name} ${p.address}`.toLowerCase();
        const okSearch = !q || text.includes(q);
        const okStatus = status === "all" || p.status === status;
        return okSearch && okStatus;
      });

      if (sort === "availableDesc") {
        filtered.sort((a, b) => b.available - a.available);
      } else if (sort === "availableAsc") {
        filtered.sort((a, b) => a.available - b.available);
      } else if (sort === "nameAsc") {
        filtered.sort((a, b) => a.name.localeCompare(b.name, "ko"));
      }

      els.listTitle.textContent = "주차장 목록";
      els.shownCount.textContent = filtered.length.toLocaleString();
      renderMarkers(filtered);
      renderList(filtered);
    }

    function drawSearchRadius(lat, lng) {
      if (radiusCircle) map.removeLayer(radiusCircle);
      radiusCircle = L.circle([lat, lng], {
        radius: SEARCH_RADIUS_KM * 1000,
        color: "#2563eb",
        weight: 2,
        dashArray: "6 6",
        fillColor: "#2563eb",
        fillOpacity: 0.06,
      }).addTo(map);
    }

    function showTop3Recommendations() {
      if (!userPosition) {
        setGpsMessage("추천 Top 3는 GPS 확인 후 사용할 수 있습니다.", "warn");
        locateUser(true);
        return;
      }

      listMode = "top3";
      const { lat, lng } = userPosition;

      const ranked = withCoords(PARKINGS)
        .map(p => {
          const metrics = calcParkingScore(p, lat, lng);
          if (!metrics) return null;
          return { ...p, ...metrics };
        })
        .filter(Boolean)
        .sort((a, b) => b.score - a.score)
        .slice(0, 3);

      filtered = ranked;
      els.listTitle.textContent = "추천 Top 3 (5km 이내)";
      els.shownCount.textContent = filtered.length.toLocaleString();
      renderMarkers(filtered);
      renderList(filtered, { ranked: true });

      drawSearchRadius(lat, lng);
      map.setView([lat, lng], 15);

      if (filtered.length) {
        const top = filtered[0];
        setGpsMessage(
          `추천 1위: ${top.name} (점수 ${(top.score * 100).toFixed(1)}, ${Math.round(top.distKm * 1000)}m, 여유율 ${(top.availRate * 100).toFixed(0)}%)`,
          "ok"
        );
        if (markers.length) {
          const group = L.featureGroup([...markers, userMarker, radiusCircle].filter(Boolean));
          map.fitBounds(group.getBounds().pad(0.15));
        }
      } else {
        setGpsMessage("5km 이내 주차장이 없습니다. 다른 위치에서 GPS를 다시 확인해 보세요.", "warn");
      }
    }

    function fitAll() {
      if (!markers.length) return;
      const group = L.featureGroup(markers);
      map.fitBounds(group.getBounds().pad(0.12));
      setTimeout(() => map.invalidateSize(), 100);
    }

    function distanceKm(aLat, aLng, bLat, bLng) {
      const R = 6371;
      const dLat = (bLat - aLat) * Math.PI / 180;
      const dLng = (bLng - aLng) * Math.PI / 180;
      const s1 = Math.sin(dLat / 2) ** 2;
      const s2 = Math.cos(aLat * Math.PI / 180) * Math.cos(bLat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s1 + s2));
    }

    function nearHannam() {
      listMode = "near";
      filtered = withCoords([...PARKINGS])
        .map(p => ({...p, dist: distanceKm(HANNAM.lat, HANNAM.lng, p.lat, p.lng)}))
        .sort((a, b) => a.dist - b.dist)
        .slice(0, 10);

      els.listTitle.textContent = "한강진역 주변 10개";
      els.shownCount.textContent = filtered.length.toLocaleString();
      renderMarkers(filtered);
      renderList(filtered);
      fitAll();
    }

    function setGpsMessage(msg, cls = "") {
      els.gpsStatus.className = `gps-status ${cls}`;
      els.gpsStatus.textContent = msg;
    }

    function locateUser(thenTop3 = false) {
      if (!navigator.geolocation) {
        setGpsMessage("이 브라우저는 GPS 기능을 지원하지 않습니다.", "error");
        return;
      }

      setGpsMessage("현재 위치를 확인하는 중입니다...", "warn");

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;
          userPosition = { lat: latitude, lng: longitude };

          if (userMarker) map.removeLayer(userMarker);
          if (userCircle) map.removeLayer(userCircle);

          userMarker = L.marker([latitude, longitude]).addTo(map).bindPopup("현재 위치").openPopup();
          userCircle = L.circle([latitude, longitude], {
            radius: accuracy,
            color: "#2563eb",
            fillOpacity: 0.1,
          }).addTo(map);

          const nearest = withCoords(PARKINGS)
            .map(p => ({...p, dist: distanceKm(latitude, longitude, p.lat, p.lng)}))
            .sort((a, b) => a.dist - b.dist)[0];

          map.setView([latitude, longitude], 15);

          if (thenTop3) {
            showTop3Recommendations();
            return;
          }

          if (nearest) {
            setGpsMessage(
              `GPS 확인 완료. 정확도 약 ${Math.round(accuracy)}m / 가장 가까운 주차장: ${nearest.name} (${nearest.dist.toFixed(2)}km)`,
              "ok"
            );
          } else {
            setGpsMessage(`GPS 확인 완료. 정확도 약 ${Math.round(accuracy)}m`, "ok");
          }

          if (listMode === "top3") {
            showTop3Recommendations();
          }
        },
        (err) => {
          setGpsMessage(`GPS 오류: ${err.message}`, "error");
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0,
        }
      );
    }

    async function loadLatestParkingData() {
      setGpsMessage("서울시 API에서 최신 주차장 정보를 불러오는 중입니다... (처음엔 5~10초)", "warn");
      els.parkingList.innerHTML = `<div class="card">데이터를 불러오는 중입니다...</div>`;

      try {
        const res = await fetch("/api/parkings", { cache: "no-store" });
        const data = await res.json();

        if (!data.success) {
          setGpsMessage(`데이터 불러오기 실패: ${data.error}`, "error");
          els.parkingList.innerHTML = `<div class="card">불러오기 실패: ${data.error || "알 수 없는 오류"}<br>서버 창을 닫았다가 start.bat으로 다시 실행해 보세요.</div>`;
          return;
        }

        PARKINGS = withCoords(data.parkings);

        const totalAvailable = PARKINGS.reduce((sum, p) => sum + (p.available || 0), 0);
        els.coordCount.textContent = PARKINGS.length.toLocaleString();
        els.availableCount.textContent = totalAvailable.toLocaleString();
        els.updatedAt.textContent = new Date().toLocaleTimeString();

        if (listMode === "top3" && userPosition) {
          showTop3Recommendations();
        } else {
          applyFilters();
          setGpsMessage(`최신화 완료. 전체 주차장 ${PARKINGS.length}개 / ${new Date().toLocaleTimeString()} 갱신`, "ok");
        }

        if (markers.length) {
          fitAll();
        }

      } catch (err) {
        setGpsMessage(`오류 발생: ${err.message}`, "error");
        els.parkingList.innerHTML = `<div class="card">서버에 연결할 수 없습니다.<br>start.bat을 실행한 뒤 http://127.0.0.1:5000/ 로 접속하세요.</div>`;
      }
    }

    els.searchInput.addEventListener("input", applyFilters);
    els.statusFilter.addEventListener("change", applyFilters);
    els.sortSelect.addEventListener("change", applyFilters);
    els.fitAllBtn.addEventListener("click", () => {
      listMode = "all";
      applyFilters();
      fitAll();
    });
    els.nearHannamBtn.addEventListener("click", nearHannam);
    els.locateBtn.addEventListener("click", () => locateUser(false));
    els.top3Btn.addEventListener("click", showTop3Recommendations);
    els.refreshBtn.addEventListener("click", loadLatestParkingData);

    loadLatestParkingData();
    setInterval(loadLatestParkingData, 60000);

    window.addEventListener("resize", () => {
      setTimeout(() => map.invalidateSize(), 150);
    });
  </script>
</body>
</html>
